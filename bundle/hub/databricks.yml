# The self-service hub, as a Databricks Asset Bundle: both apps (the self-service app and the
# approvals app) and their Lakebase project, in the central workspace (config/self-service/hub.yaml).
# Deploy with scripts/app_deploy.py (GitHub Actions does, on merge). It first runs
# scripts/app_build.py, which writes build/ (each app's code and config.json) and
# build/target.yml (the target "hub", from config/self-service/).
bundle:
  name: self-service-hub

include:
  - resources/*.yml
  - build/target.yml

variables:
  self_service_name:
    description: The self-service app's name.
  approvals_name:
    description: The approvals app's name.
  database_project:
    description: The Lakebase project's ID.
  database_display_name:
    description: The Lakebase project's name, as shown in the workspace.
  database_min_cu:
    description: The database's compute size while running, in capacity units.
  database_max_cu:
    description: The database's largest compute size, in capacity units.
  database_suspend_after:
    description: Idle time before the database scales to zero.

# build/ is not in Git; the bundle uploads it, and nothing else.
sync:
  paths:
    - build
  include:
    - build/**

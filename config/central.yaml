# =============================================================================
# CENTRAL: what lives once, in the central workspace, rather than in every workspace.
#
# The central workspace is the one that serves the AI review's model (ai_review_host in
# config/setup.yaml), unless host says otherwise. Terraform for it is in terraform/central/,
# planned and applied like a workspace, under the name "central" (docs/SETUP.md, step 10).
# =============================================================================

host: null                 # the central workspace's URL. null = ai_review_host in config/setup.yaml

# ---- Cost dashboard ------------------------------------------------------------
# An AI/BI dashboard of what each workspace's usage costs: by usage policy, project and
# product, in estimated $ and in DBUs. Each person sees only the workspaces they belong to
# (through their persona or platform admins group), whatever page they open.
cost_dashboard:
  enabled: true
  name: Citizen development costs        # the platform admins' dashboard: their workspaces, by person
  users_name: My Databricks costs         # everyone's dashboard: only their own usage
  # The catalog that holds the cost view: an existing catalog in the central workspace,
  # NOT a workspace catalog this repository manages ({prefix}_citizen_dev: its grants are
  # authoritative). Required while enabled.
  catalog: guanjie_self_service
  schema: cost             # created in that catalog
  # An existing SQL warehouse (its ID) for the dashboard and the view. null = Terraform
  # creates a small serverless one; an existing one keeps its own permissions, so give
  # the persona groups Can use on it.
  warehouse_id: null
  warehouse_size: 2X-Small # for a warehouse Terraform creates
  # Your negotiated discount off list price, 0 to 100. The dashboard's $ is list price
  # times (1 - discount_percent / 100); DBUs are unchanged.
  discount_percent: 0
  folder: /Workspace/Shared/Citizen development   # where the dashboard is created

# =============================================================================
# SELF-SERVICE APP: the app's settings. The web app people use to ask for a personal,
# project or team schema or a workspace folder, the approvals app, and the jobs they run in
# each workspace the app serves. Deployed by the Databricks Asset Bundles in bundle/ (not by
# Terraform): scripts/app_build.py reads this file, config/self-service/hub.yaml and each
# served workspace's file and Terraform output, and checks them.
# =============================================================================

self_service_app:
  name: cd-self-service                  # the app's name (lowercase letters, digits, dashes)
  title: Databricks Self-Service         # shown in the header
  # Links shown in the app. null = not shown. With the approvals app, approvers can override
  # persona_request, sop and faq in its Settings page (these are then the defaults).
  links:
    wiki: null                           # header link to the platform's wiki
    go_link: null                        # a short link to the app, shown on each page (for example go/cd-self-service)
    # Where people ask for a persona (an Entra access package or My Groups): one link for
    # all, or one per persona, for example {explorer: <url>, builder: <url>, publisher: <url>}.
    persona_request: null
    # Where people review data access requests in Databricks: the ones they made, and the ones
    # others made for their data (Catalog Explorer's requests view). {host} and {workspace_id}
    # are the hub's; or a full URL (for example on your own domain). null = no tile.
    review_requests: "{host}/explore/data?o={workspace_id}&requestsView=audit"
    # The workspace's Discover page: data assets curated by business domain. {host} and
    # {workspace_id} as above; null = no Discover data card.
    discover: "{host}/discover?o={workspace_id}"
    sop:                                 # the standard operating procedure behind each task
      schema: null                       # personal schemas
      project_schema: null
      team_schema: null
      persona: null
      folder: null
      warehouses: null
  # The app's database (Lakebase Postgres), always created with the app: requests and their
  # history (what was asked, comments, decisions, the link to the job run) and the settings
  # changed in the approvals app. Code first: the hub's bundle creates the project,
  # scripts/app_deploy.py the database, and applies the SQL in apps/self-service/db/ (tables,
  # view, grants). Scales to zero when idle. Who may read it: database.readers in hub.yaml.
  database:
    project_id: cd-self-service        # lowercase letters, digits and dashes
    min_cu: 0.5                        # compute size while running, in capacity units
    max_cu: 2
    suspend_after: 300s                # idle time before it scales to zero
    # The database's name in Unity Catalog (lowercase letters, digits and _), read by the jobs
    # that require a request record (jobs.require_request_record below). null = none.
    catalog: null
  # Who is in which business unit: a Unity Catalog SQL function, catalog.schema.function, that
  # takes a person's email and returns their business unit (a served workspace's prefix, any
  # case), or null. With one, the forms offer only the person's own BU's workspace (its
  # catalog, its folders) and refuse others; someone it does not know is asked to contact their
  # platform admin. It runs on the hub's warehouse_id (hub.yaml; the bundle lets the
  # self-service app use it).
  # The function's owner grants its EXECUTE (and SELECT on what it reads) to the self-service
  # app's service principal: outside this repository. null = no routing.
  bu_lookup:
    function: null
  # The approvals app: the same code deployed a second time (mode approvals), which only the
  # approvers can open. It lists every request in the business units the app serves (All
  # requests) and the ones that need a person (Needs review). Who may open it:
  # approvals_group in hub.yaml.
  approvals:
    name: cd-approvals                 # the app's name (lowercase letters, digits and dashes)
  # The kinds of request a person must approve, in the approvals app, before their job runs
  # (any of personal_schema, project_schema, team_schema, folder). The others run when asked.
  human_approval: [project_schema, team_schema]
  # The AI check of the name and the reason, on the project schema, team schema and folder
  # forms: the app's rules, then Databricks AI Decide. Validate shows the requester what is
  # unclear. Advice for the requester only: it never approves, refuses or routes a request
  # (human_approval decides who must approve; approvers read the AI summary below).
  #   on:  the Validate check
  #   off: no check
  # Needs AI Decide in the host workspace.
  ai_check: "on"
  # The summary approvers read before a request that waits for them: a headline, what is
  # asked and why, what is worth checking and questions to ask, written by a foundation model
  # through the host workspace's AI gateway (the apps' identities need EXECUTE on it; account
  # users have it on system.ai by default). Advice only; the requester never sees it.
  ai_summary:
    model: system.ai.claude-sonnet-5-5   # null = no summary
  # Genie One Onboarding: a card that opens Genie One in the person's workspace with this question
  # already asked. "onboard me" starts the onboard-me skill every workspace gets
  # (config/defaults/genie-code/skills/onboard-me/): an introduction, the data the person can see,
  # first questions, and notes so later sessions coach them. Platform admins change it in the
  # approvals app's Settings; "" hides the card.
  onboarding:
    prompt: onboard me
  # FAQ pages: an FAQ link beside each section of the catalog, and "How it works" for people
  # who are new. null = no link. PLACEHOLDERS until the real pages exist: replace each with
  # its SharePoint page.
  faq:
    getting_started: https://en.wikipedia.org/wiki/FAQ   # "New here? ... How it works"
    access: https://en.wikipedia.org/wiki/FAQ            # Get started: workspace access, Genie One Onboarding
    data: https://en.wikipedia.org/wiki/FAQ              # Data: Discover, data access requests
    workspace: https://en.wikipedia.org/wiki/FAQ         # Build: schemas and folders
    compute: https://en.wikipedia.org/wiki/FAQ           # Compute & cost

# The self-service jobs, in each workspace the app serves (bundle/jobs/). The catalog they create
# schemas in is the workspace's own (its Terraform output), never set here.
jobs:
  # Where the jobs' notebooks live: at the top of the workspace, which grants only workspace
  # admins (the jobs run with admin rights).
  admin_path: /Workspace/Admin/self-service
  folder_root: /Workspace             # where team folders are made
  catalog_owner: null                 # new schemas go to this group; null = the job's identity
  personal_schema:                    # a person's own schema: cd_<email name>
    prefix: cd_
    privileges: [ALL_PRIVILEGES, MANAGE]
  require_request_record: false       # true: a job runs only for requests the app recorded

# The guanjie_shen_spoke_2 workspace (journey 1: add a workspace): the sandbox's second spoke
# for the self-service app, so the app serves two business units (GSP and GSQ).
prefix: gsq
host: https://adb-7405608982373516.16.azuredatabricks.net

# Shown next to the workspace name in the top bar.
label:
  text: gsq spoke
  color: lime

# The same groups as the other workspaces: one audience for the sandbox, so one person can
# test both business units.
groups:
  users: gss-cd-users
  explorer: gss-cd-explorers
  builder: gss-cd-builders
  publisher: null          # nobody gets this persona here
  platform_admins: gss_platform_admins   # the hub's admins run this workspace too

# ---- Changes to the baseline, for this workspace only ----------------------

# This workspace's default self-service application ID (a placeholder until it has one).
tags:
  APPID: GSQ-SANDBOX

# The metastore has no storage root, so the catalog keeps its data in our own storage,
# in a folder of its own (the external location guanjie-catalogs-2026 covers this path).
catalog:
  storage_root: abfss://catalogs@guanjiecat2026.dfs.core.windows.net/guanjie_shen_spoke_2

# A small team for now: a smaller default warehouse (the baseline's auto-stop stays).
sql_warehouse:
  size: X-Small

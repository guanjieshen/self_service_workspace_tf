# The guanjie_shen_spoke workspace (journey 1: add a workspace): the sandbox's spoke for the
# self-service app (its jobs run here; the apps run in guanjie_self_service).
prefix: gsp
host: https://adb-7405616957080916.16.azuredatabricks.net

# Shown next to the workspace name in the top bar.
label:
  text: gsp spoke
  color: turquoise

# The same groups as guanjie_self_service: one audience for the sandbox.
groups:
  users: gss-cd-users
  explorer: gss-cd-explorers
  builder: gss-cd-builders
  publisher: null          # nobody gets this persona here
  platform_admins: gss_platform_admins   # the hub's admins run this workspace too

# Domains: groups with their own warehouse, budget policy, folder and APPID, on top of the
# groups above (the example for the domains feature; its groups must exist in Entra and the
# account before this is planned). Each creates:
#   finance:      GSP FINANCE Warehouse (Small), GSP-0-DOMAIN-FINANCE, /Workspace/Domains/FINANCE
#   supply_chain: GSP SUPPLY CHAIN Warehouse (X-Small, as above), GSP-0-DOMAIN-SUPPLY-CHAIN, no folder
domains:
  finance:
    groups:
      explorer: gsp-finance-explorers      # read its folder; use its warehouse and policy
      builder: gsp-finance-builders        # manage its folder; use its warehouse and policy
      publisher: gsp-finance-publishers    # the same as builder
    tags:
      APPID: GSP-FINANCE                   # its own application ID, on its warehouse and policy
    sql_warehouse: {size: Small}
  supply_chain:
    groups:
      explorer: [gsp-supply-planners, gsp-supply-analysts]
    tags:
      APPID: GSP-SUPPLY
    folder: false                          # its work lives in the finance folder for now

# ---- Changes to the baseline, for this workspace only ----------------------

# This workspace's default self-service application ID (a placeholder until it has one).
tags:
  APPID: GSP-SANDBOX

# The metastore has no storage root, so the catalog keeps its data in our own storage,
# in a folder of its own (the external location guanjie-catalogs-2026 covers this path).
catalog:
  storage_root: abfss://catalogs@guanjiecat2026.dfs.core.windows.net/guanjie_shen_spoke

# A small team for now: a smaller default warehouse (the baseline's auto-stop stays).
sql_warehouse:
  size: X-Small

# The guanjie_shen_spoke workspace (journey 1: add a workspace): the sandbox's spoke for the
# self-service app (its jobs run here; the apps run in guanjie_self_service).
prefix: gsp
host: https://adb-7405616957080916.16.azuredatabricks.net

# Shown next to the workspace name in the top bar.
label:
  text: gsp spoke
  color: turquoise

# The same groups as guanjie_self_service: one audience for the sandbox.
groups:
  users: gss-cd-users
  explorer: gss-cd-explorers
  builder: gss-cd-builders
  publisher: null          # nobody gets this persona here

# ---- Changes to the baseline, for this workspace only ----------------------

# This workspace's default self-service application ID (a placeholder until it has one).
tags:
  APPID: GSP-SANDBOX

# The metastore has no storage root, so the catalog keeps its data in our own storage,
# in a folder of its own (the external location guanjie-catalogs-2026 covers this path).
catalog:
  storage_root: abfss://catalogs@guanjiecat2026.dfs.core.windows.net/guanjie_shen_spoke

# A small team for now: a smaller default warehouse (the baseline's auto-stop stays).
sql_warehouse:
  size: X-Small

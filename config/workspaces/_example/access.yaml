# =============================================================================
# ACCESS for this workspace.
# What each persona gets is in config/defaults/access.yaml. Here: which Entra ID
# group holds each persona in this workspace. Who is in each group is managed in
# Entra ID, not here.
# =============================================================================

# One account group per persona (Entra ID, synced to the Databricks account).
# null = nobody gets that persona here; the others still apply. The platform admins
# group comes from the baseline ({bu}_platform_admins); set it here only to use another.
groups:
  users: null          # everyone who may use the workspace: consumer access (Databricks One)
  explorer: null       # SQL, dashboards and Genie
  builder: null        # the full workspace: notebooks, jobs, pipelines
  publisher: null      # the same as builder here

# Teams: their tags become allowed values on the cluster policies, and a team can get
# its own warehouse (compute.yaml), usually by a self-service request (a pull request).
# Keys: lowercase letters,
# digits, dashes.
teams: {}
#  integrity:
#    group: xyz-integrity
#    tags:                     # must set DEPARTMENT and TEAM
#      DEPARTMENT: INTEGRITY
#      TEAM: "1"

# ---- Changes to the baseline, for this workspace only -----------------------
# Let builders create personal access tokens (baseline: nobody but platform admins):
# personas:
#   builder:
#     can_create_tokens: true

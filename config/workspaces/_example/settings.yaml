# Any key of config/defaults/settings.yaml can be set here, for this workspace
# only, with the same name and shape. Keys not set keep the baseline value.
# null = Terraform leaves the setting alone (it keeps its current value).
#
# Every difference from the baseline is reviewed in the pull request, so give
# the reason in a comment next to it.
# =============================================================================


# =============================================================================
# SETUP: the values the one-time setup needs (docs/SETUP.md, step 1).
#
# Fill in the four REQUIRED values. Everything below them has a default.
# Then run, in order (each prints what it will do; add --run to do it):
#   python3 scripts/setup.py state | identity | github | databricks
#
# None of these are secrets: commit this file.
# =============================================================================

# ---- REQUIRED ---------------------------------------------------------------

subscription_id: edd4cc45-85c7-4aec-8bf5-648062d519bf   # Azure subscription for the Terraform state (cloud team)
state_resource_group: guanjie-rg                        # resource group for the state; created if missing (cloud team)
state_storage_account: guanjieadls2026                  # storage account for the state: 3 to 24 lowercase letters and digits; created if missing (cloud team)
databricks_account_id: null                             # Databricks account ID: account console, top right (Databricks account admin)

# ---- OPTIONAL: change only if the default does not suit you -----------------

state_location: canadacentral       # region, only to create the resource group or storage account. Default: the resource group's
state_container: tfstatetest        # blob container for the state files. Default: tfstate
github_repo: null                   # <org>/<repo>. Default: this checkout's GitHub origin
pipeline_name: null                 # display name of the service principal CI signs in as. Default: sp-citizen-dev-terraform
apply_approvers: null               # <org>/<team> that must approve each apply. Default: none (merging approves)
databricks_account_profile: null    # Databricks CLI profile for the account. Default: sign in with the Azure CLI

# ---- WRITTEN BY SETUP: leave empty -------------------------------------------

tenant_id: bf465dc7-3bc8-4944-b018-092572b5c20d   # Entra tenant ID (`setup.py identity --run` writes it)
pipeline_client_id: null                          # the service principal's client ID (`setup.py identity --run` writes it)

# =============================================================================
# SETUP: the values the one-time setup needs (docs/SETUP.md, step 1).
#
# Fill in every REQUIRED value; the OPTIONAL ones have defaults.
# Then run, in order (each prints what it will do; add --run to do it):
#   python3 scripts/setup.py state | identity | github
# The Databricks account step (docs/SETUP.md, step 6) is done by hand.
#
# None of these are secrets: commit this file.
# =============================================================================

# ---- REQUIRED ---------------------------------------------------------------

tenant_id: bf465dc7-3bc8-4944-b018-092572b5c20d         # Entra tenant ID; the steps check you are signed in to it (Entra admin)
subscription_id: edd4cc45-85c7-4aec-8bf5-648062d519bf   # Azure subscription for the Terraform state (cloud team)
state_location: canadacentral                           # region for the state storage (cloud team)
state_resource_group: guanjie-rg                        # resource group for the state; created if missing (cloud team)
state_storage_account: guanjieadls2026                  # storage account: 3 to 24 lowercase letters and digits; created if missing (cloud team)
state_container: tfstatetest                            # blob container for the state files, for example tfstate (cloud team)

# ---- OPTIONAL: the default is fine unless you have a reason -----------------

github_repo: null                   # <org>/<repo> that runs the pipeline (Entra trusts only it). Default: this clone's GitHub origin
pipeline_name: null                 # display name of the service principal CI signs in as. Default: sp-citizen-dev-terraform
apply_approvers: null               # <org>/<team> that must approve each apply. Default: none (merging approves)
ai_review_host: https://adb-7405612439356111.11.azuredatabricks.net   # URL (https://adb-<id>.<n>.azuredatabricks.net) of the workspace whose model reviews every plan; any workspace the pipeline can sign in to. Default: no AI review
ai_review_model: system.ai.claude-opus-5-5   # the model there, a Unity Gateway model service. Default: system.ai.claude-sonnet-5-5

# ---- WRITTEN BY SETUP: leave empty -------------------------------------------

pipeline_client_id: null            # the service principal's client ID (`setup.py identity --run` writes it)

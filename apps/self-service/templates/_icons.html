{#- Line icons (Lucide shapes, 1.75 stroke), sized by CSS. -#}
{%- macro icon(name, cls="icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "schema" -%}<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
{%- elif name == "persona" -%}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
{%- elif name == "folder" -%}<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>
{%- elif name == "warehouses" -%}<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M8 8h.01M8 16h.01"/>
{%- elif name == "requests" -%}<rect x="3" y="3" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M6 8v3a3 3 0 0 0 3 3h9M15 11l3 3-3 3"/>
{%- elif name == "catalog" -%}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == "alert" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>
{%- elif name == "info" -%}<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- elif name == "external" -%}<path d="M7 17 17 7M9 7h8v8"/>
{%- elif name == "arrow" -%}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "back" -%}<path d="M15 18l-6-6 6-6"/>
{%- elif name == "ask" -%}<path d="M21 12a8 8 0 0 1-11.8 7l-4.2 1 1-3.8A8 8 0 1 1 21 12z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5M12 16h.01"/>
{%- elif name == "chart" -%}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == "budget" -%}<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>
{%- elif name == "search" -%}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == "copy" -%}<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>
{%- elif name == "check" -%}<path d="M20 6 9 17l-5-5"/>
{%- endif -%}
</svg>
{%- endmacro -%}

# =============================================================================
# ADJUSTABLE: COMPUTE
# The default SQL warehouse, team warehouses, the shared cluster, and the
# cluster policy templates personas use to create their own classic compute.
#
# Sizes, scaling, timeouts, node types and names are updated in place.
# Changing a warehouse `type`, or the shared cluster's single_node, may
# recreate it with a new ID (dashboards and jobs pointing at the old ID then
# need updating); scripts/tf.sh warns before applying that.
#
# A single workspace can resize its default warehouse, turn on the classic
# warehouse, or change or turn off its shared cluster, in its file (config/workspaces/<name>.yaml).
# Team warehouses (team_warehouses:) are defined only in the workspace's file.
# =============================================================================

# ---- Default SQL warehouse --------------------------------------------------
# One warehouse every persona can use (see default_warehouse in config/defaults/access.yaml).
sql_warehouse:
  name: "{BU} Default Warehouse"
  type: serverless             # serverless | pro | classic
  size: Small                  # 2X-Small | X-Small | Small | Medium | Large | X-Large | ...
  auto_stop_minutes: 5         # stop after this many idle minutes
  min_clusters: 1              # scaling range
  max_clusters: 2
  # true = this warehouse is selected by default for every user in SQL (the admin
  # setting "Default warehouse"; users can still pick another). false = leave that setting alone.
  workspace_default: true
  tags:                        # the workspace's own tags (tags: in its file) are added too
    DEPARTMENT: SHARED
    TEAM: SHARED

# ---- Classic warehouse (optional) -------------------------------------------
# A second SQL warehouse on classic compute, next to the serverless default, for
# work that needs it. Same access as the default warehouse (default_warehouse in
# config/defaults/access.yaml). Off unless a workspace turns it on with
# `classic_warehouse: enabled: true` in its file. Classic compute runs in the
# workspace's own Azure subscription and takes a few minutes to start.
classic_warehouse:
  enabled: false
  name: "{BU} Classic Warehouse"
  type: classic                # classic | pro (the serverless one is sql_warehouse)
  size: Small
  auto_stop_minutes: 10        # classic starts slowly, so stop a little later
  min_clusters: 1
  max_clusters: 1
  tags:
    DEPARTMENT: SHARED
    TEAM: SHARED

# ---- Shared cluster ---------------------------------------------------------
# One classic cluster for work that serverless cannot do yet (for example JARs).
# Who can use it is set by shared_cluster in config/defaults/access.yaml.
shared_cluster:
  enabled: true
  name: "{BU} Shared Single Node"
  # A pinned version: changing the runtime of a running cluster restarts it, so it changes
  # only through a pull request (whose plan shows it), never on an unrelated apply.
  # latest_lts follows each new LTS release instead, restarting the cluster on the next apply.
  # List versions: databricks clusters spark-versions
  runtime: 18.x-scala2.13      # 18 LTS (Spark 4.1), the latest LTS in October 2026
  node_type: Standard_E32_v3
  single_node: true
  num_workers: 0               # used only when single_node is false
  autotermination_minutes: 60
  tags:
    DEPARTMENT: SHARED
    TEAM: SHARED

# ---- Cluster policy ---------------------------------------------------------
# Each persona with cluster_policy: true (config/defaults/access.yaml) gets its own
# cluster policy from these rules, named for example "FIN Builder Compute" and
# tagged PERSONA=BUILDER. Users must pick allowed values for the required tags
# (config/defaults/cost.yaml).
cluster_policy:
  name: "{BU} {PERSONA} Compute"
  runtime: lts_only               # lts_only = long-term-support runtimes only | any
  access_modes:                   # STANDARD (shared, Unity Catalog) and/or DEDICATED (single user)
    - STANDARD
  node_types:                     # VM sizes users may choose; the first is the default
    - Standard_E8_v3
    - Standard_E16_v3
    - Standard_E32_v3
  max_workers: 4
  max_autotermination_minutes: 60 # clusters must stop after at most this many idle minutes
  max_clusters_per_user: 1        # one cluster per person

# On every pull request: formatting, validation, the cross-workspace checks and every test.
# Required by branch protection on main ("Format and validate", "Tests"). The workspaces' plans
# run in deploy.yml. CHECKS_RUNNER (a repository variable, JSON runs-on value) picks the runner,
# for organizations without GitHub-hosted runners.
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format and validate
    runs-on: ${{ fromJSON(vars.CHECKS_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          sign-in: "false"
      - run: terraform fmt -check -recursive terraform
      # Across workspaces: unique hosts, ids and catalog names, budget policy names that do
      # not collide on an account, and file names safe for workflow commands.
      - run: python3 scripts/workspaces.py check
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate

  tests:
    name: Tests
    runs-on: ${{ fromJSON(vars.CHECKS_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          sign-in: "false"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Mocked providers: no workspace, credentials or network. Same as ./scripts/test.sh locally.
      - run: ./scripts/test.sh

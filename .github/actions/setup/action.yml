# Shared setup for every Terraform job: Terraform itself, plus the sign-in settings.
# One Entra service principal (AZURE_CLIENT_ID) signs in through GitHub OIDC, for both the
# Terraform state (Azure Storage) and Databricks (see docs/github-actions.md).
name: Set up Terraform and sign-in
description: Installs Terraform and exports the sign-in settings for the azurerm backend and the Databricks provider.
inputs:
  sign-in:
    description: Set to "false" for jobs that do not reach Azure or Databricks (format and validate).
    default: "true"
  workspace:
    description: Workspace name (config/workspaces/<name>.yaml). When set, DATABRICKS_HOST is set to its host.
    default: ""
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.16.5
        terraform_wrapper: false
    # The Databricks CLI calls the model for the AI review (scripts/ai-plan-review.py).
    - uses: databricks/setup-cli@9625fdde9ba2607df0087e0d3ec7449198bf2180 # v1.23.0
      if: inputs.sign-in == 'true'
    # setup-terraform and setup-cli leave Terraform and the CLI in the job's temp folder, which a
    # self-hosted runner can lose during the job (another job emptying a shared _work/_temp):
    # kept in the tool cache instead, one folder per build, written whole before it is used.
    - name: Keep Terraform and the Databricks CLI
      shell: bash
      env:
        SIGN_IN: ${{ inputs.sign-in }}
      run: |
        tools=(terraform)
        [[ "$SIGN_IN" == "true" ]] && tools+=(databricks)
        for tool in "${tools[@]}"; do
          bin="$(command -v "$tool")"
          dir="${RUNNER_TOOL_CACHE:-$HOME/.cache}/kept-tools/$tool/$(sha256sum "$bin" | cut -c1-16)"
          if [[ ! -x "$dir/$tool" ]]; then
            mkdir -p "$dir"
            new="$(mktemp "$dir/.$tool.XXXXXX")"
            cp "$bin" "$new" && chmod +x "$new"
            mv -f "$new" "$dir/$tool"   # a rename: another job sees the old file or the new, never half
          fi
          echo "$dir" >> "$GITHUB_PATH"
        done
    - name: Sign-in settings
      if: inputs.sign-in == 'true'
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        fail() { echo "::error::$1"; exit 1; }
        if [[ -n "$WORKSPACE" ]]; then
          # The same YAML reading as the rest of the scripts (quotes, comments), and the
          # name is checked before it is used anywhere.
          host="$(python3 scripts/workspaces.py field "$WORKSPACE" host)" || fail "$WORKSPACE: no host in config/workspaces/$WORKSPACE.yaml"
          echo "Workspace: $host"
          echo "DATABRICKS_HOST=$host" >> "$GITHUB_ENV"
        fi
        # Providers downloaded once per runner, not once per job (long-lived self-hosted runners).
        cache="${RUNNER_TOOL_CACHE:-$HOME/.cache}/terraform-plugins"
        mkdir -p "$cache"
        {
          echo "TF_PLUGIN_CACHE_DIR=$cache"
          echo "ARM_USE_OIDC=true"
          echo "ARM_USE_AZUREAD=true"
          echo "DATABRICKS_AUTH_TYPE=github-oidc-azure"
        } >> "$GITHUB_ENV"
